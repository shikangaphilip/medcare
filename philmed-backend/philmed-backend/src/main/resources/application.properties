# ── DATABASE (MySQL) ──
spring.datasource.url=jdbc:mysql://localhost:3306/philmed?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=changeme
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ── JPA / HIBERNATE ──
# update = auto-create/alter tables from the entities below. Good for development;
# switch to "validate" (and use a migration tool like Flyway) once this is in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# ── JWT ──
# Replace with your own long, random secret (32+ characters) before deploying.
philmed.jwt.secret=change-this-to-a-long-random-secret-at-least-32-characters
philmed.jwt.expiration-ms=86400000

# ── CORS ──
# "*" is fine for local development (opening philmed.html directly, or via
# a simple static server). Before deploying, set this to your real frontend
# origin(s), comma-separated, e.g.:
# philmed.cors.allowed-origins=https://philmed.health,https://www.philmed.health
philmed.cors.allowed-origins=*

# ── SERVER ──
server.port=8080
